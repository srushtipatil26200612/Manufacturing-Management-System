<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Raw Material</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            margin: 20px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin: 0 0 25px;
            color: #263746;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            margin-bottom: 18px;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #40596e;
            box-shadow: 0 0 4px rgba(64, 89, 110, 0.3);
        }

        button,
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 6px;
            background: #263746;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover,
        .button:hover {
            background: #40596e;
        }

        .error {
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            background: #fee2e2;
            color: #b91c1c;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add New Raw Material</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Material Name:</label>
            <input type="text" name="name" required>

            <label>Material Code:</label>
            <input type="text" name="material_code" required>

            <label>Supplier:</label>
            <select name="supplier">
                <option value="">Select Supplier</option>
                {% for supplier in suppliers %}
                    <option value="{{ supplier.id }}">
                        {{ supplier.name }}
                    </option>
                {% endfor %}
            </select>

            <label>Quantity:</label>
            <input type="number" name="quantity" min="0" required>

            <label>Unit:</label>
            <input type="text" name="unit"
                   placeholder="Kg / Litre / Piece" required>

            <label>Price:</label>
            <input type="number" name="price" step="0.01"
                   min="0" required>

            <button type="submit">Add Raw Material</button>
        </form>

        <a href="{% url 'raw_material_page' %}" class="button">
            ← Back to Raw Materials
        </a>

        <a href="{% url 'dashboard' %}" class="button">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
