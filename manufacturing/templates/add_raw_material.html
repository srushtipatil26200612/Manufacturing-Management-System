<!DOCTYPE html>
<html>
<head>
    <title>Add Raw Material</title>
</head>
<body>

    <h1>Add New Raw Material</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Material Name:</label><br>
        <input type="text" name="name" required>

        <br><br>

        <label>Material Code:</label><br>
        <input type="text" name="material_code" required>

        <br><br>

        <label>Supplier:</label><br>
        <select name="supplier">
            <option value="">Select Supplier</option>

            {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">
                    {{ supplier.name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" min="0" required>

        <br><br>

        <label>Unit:</label><br>
        <input type="text" name="unit" placeholder="Kg / Litre / Piece" required>

        <br><br>

        <label>Price:</label><br>
        <input type="number" name="price" step="0.01" min="0" required>

        <br><br>

        <button type="submit">Add Raw Material</button>
    </form>

    <br>

    <a href="{% url 'raw_material_page' %}">
        ← Back to Raw Materials
    </a>

</body>
</html>
