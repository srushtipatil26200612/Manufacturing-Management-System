
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Invoice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e3a5f;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .back {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #1e3a5f;
            color: white;
        }

        .back {
            background: #64748b;
            color: white;
        }

        .message {
            padding: 10px;
            background: #fee2e2;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Edit Invoice</h1>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label>Sales Order</label>
        <input
            type="text"
            value="{{ invoice.sales_order.order_number }}"
            readonly
        >

        <label>Invoice Number</label>
        <input
            type="text"
            name="invoice_number"
            value="{{ invoice.invoice_number }}"
            maxlength="50"
            required
        >

        <label>Invoice Date</label>
        <input
            type="date"
            name="invoice_date"
            value="{{ invoice.invoice_date|date:'Y-m-d' }}"
            required
        >

        <label>Total Amount</label>
        <input
            type="number"
            name="total_amount"
            value="{{ invoice.total_amount }}"
            min="0.01"
            step="0.01"
            required
        >

        <label>Advance Amount</label>
        <input
            type="number"
            name="advance_amount"
            value="{{ invoice.advance_amount }}"
            min="0"
            step="0.01"
            required
        >

        <label>Status</label>
        <select name="status" required>
            <option value="Unpaid"
                {% if invoice.status == 'Unpaid' %}selected{% endif %}>
                Unpaid
            </option>

            <option value="Partially Paid"
                {% if invoice.status == 'Partially Paid' %}selected{% endif %}>
                Partially Paid
            </option>

            <option value="Paid"
                {% if invoice.status == 'Paid' %}selected{% endif %}>
                Paid
            </option>
        </select>

        <div class="actions">
            <button type="submit">Update Invoice</button>
            <a href="{% url 'invoice_page' %}" class="back">Back</a>
        </div>
    </form>
</div>
</body>
</html>
