
<!DOCTYPE html>
<html>

<head>
    <title>Categories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
            color: #1e293b;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #00000015;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #263746;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        button, input[type="submit"] {
            background: #263746;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover, input[type="submit"]:hover {
            background: #40596e;
        }

        a {
            text-decoration: none;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            margin: 10px 8px 15px 0;
            background: #263746;
            color: #ffffff;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .button:hover {
            background: #40596e;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .action-btn {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 5px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
        }

        .edit-btn {
            background: #2563eb;
        }

        .edit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            th, td {
                padding: 8px;
            }

            .action-buttons {
                gap: 5px;
            }

            .action-btn {
                padding: 6px 9px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <h1>Product Categories</h1>

    <br><br>

    <a href="{% url 'add_category' %}" class="button">
        + Add New Category
    </a>

    <a href="{% url 'dashboard' %}" class="button">
        ← Back to Dashboard
    </a>

    <br><br>

    <table>
        <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Action</th>
        </tr>

        {% for category in categories %}
        <tr>
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>

            <td>
                <div class="action-buttons">

                    <a href="{% url 'edit_category' category.id %}"
                       class="action-btn edit-btn">
                        Edit
                    </a>

                    <a href="{% url 'delete_category' category.id %}"
                       class="action-btn delete-btn"
                       onclick="return confirm('Are you sure you want to delete this category?');">
                        Delete
                    </a>

                </div>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="3" style="text-align: center;">
                No categories found.
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
