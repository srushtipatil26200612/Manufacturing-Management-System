<!DOCTYPE html>
<html>

<head>
    <title>Categories</title>
</head>

<body>

    <h1>Product Categories</h1>
    <a href="{% url 'add_category' %}">+ Add New Category</a>
    <br><br>

    <a href="{% url 'product_page' %}">← Back to Products</a>
    <br><br>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Category Name</th>
            <th>Action</th>
        </tr>

        {% for category in categories %}
        <tr>
            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>
           <td>
    <a href="{% url 'edit_category' category.id %}">Edit</a>
    |
    <a href="{% url 'delete_category' category.id %}"
       onclick="return confirm('Are you sure you want to delete this category?');">
        Delete
    </a>
</td>
        </tr>
        {% endfor %}

    </table>

</body>

</html>
