<!DOCTYPE html>
<html>
<head>
    <title>Add Invoice</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f5f5f5; }
        form { background: white; padding: 20px; max-width: 500px; }
        label { display: block; margin-top: 12px; }
        input, select, button { width: 100%; padding: 9px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 18px; background: #333; color: white; border: none; cursor: pointer; }
        .container {
    max-width: 600px;
    width: 90%;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #f3f6f9;
    font-family: Arial, sans-serif;
}
    </style>
</head>

<body>
    <div class="container">
        <h1>Add Invoice</h1>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Sales Order</label>
            <select name="sales_order" required>
                <option value="">Select Sales Order</option>
                {% for order in orders %}
                    <option value="{{ order.id }}">{{ order.order_number }}</option>
                {% endfor %}
            </select>

            <label>Invoice Number</label>
            <input type="text" name="invoice_number" required>

            <label>Invoice Date</label>
            <input type="date" name="invoice_date" required>

            <label>Total Amount</label>
            <input type="number" name="total_amount" min="0.01" step="0.01" required>

            <label>Advance Amount</label>
            <input type="number" name="advance_amount" min="0" step="0.01" value="0" required>

            <button type="submit">Save Invoice</button>
            <p><a href="{% url 'invoice_page' %}">Back to Invoices</a></p>
        </form>
    </div>
</body>

</html>
