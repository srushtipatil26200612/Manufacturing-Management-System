<!DOCTYPE html>
<html>
<head>
    <title>Add Invoice</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #f3f6f9;
        font-family: Arial, sans-serif;
    }

    .container {
        max-width: 600px;
        width: 100%;
        margin: 30px auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 15px #00000012;
    }

    h1 {
        text-align: center;
        color: #1e3a5f;
        margin-top: 0;
    }

    form {
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
    }

    label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
        color: #333;
    }

    input,
    select,
    button {
        display: block;
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 4px;
        font-size: 14px;
    }

    input,
    select {
        border: 1px solid #ccc;
        background: white;
    }


button,
.button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 18px;
    border: none;
    border-radius: 4px;
    background: #1e3a5f;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover,
.button:hover {
    background: #304f70;
}


    .back-btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        background: #1e3a5f;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.3s;
    }

    @media (max-width: 480px) {
        body {
            padding: 12px;
        }

        .container {
            padding: 18px;
        }
    }
</style>

</head>

<body>
    <div class="container">
        <h1>Add Invoice</h1>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Sales Order</label>
            <select name="sales_order" required>
                <option value="">Select Sales Order</option>
                {% for order in orders %}
                    <option value="{{ order.id }}">{{ order.order_number }}</option>
                {% endfor %}
            </select>

            <label>Invoice Number</label>
            <input type="text" name="invoice_number" required>

            <label>Invoice Date</label>
            <input type="date" name="invoice_date" required>

            <label>Total Amount</label>
            <input type="number" name="total_amount" min="0.01" step="0.01" required>

            <label>Advance Amount</label>
            <input type="number" name="advance_amount" min="0" step="0.01" value="0" required>

            <button type="submit">Save Invoice</button>

<a href="{% url 'invoice_page' %}" class="back-btn">
    ← Back to Invoices
</a>
        </form>
    </div>
</body>

</html>
