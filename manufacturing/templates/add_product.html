
<!DOCTYPE html>
<html>
<head>
    <title>Add New Product</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #243447;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: 20px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .error {
            padding: 10px;
            color: #b91c1c;
            background: #fee2e2;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1e3a5f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #294f7a;
        }

    
.back-link {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: #1e3a5f;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.3s;
}

.back-link:hover {
    background: #304f70;
}

    </style>
</head>

<body>
    <div class="container">
        <h1>Add New Product</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" required>

            <label for="product_code">Product Code</label>
            <input type="text" id="product_code" name="product_code" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select Category</option>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="0" required>

            <label for="price">Price (₹)</label>
            <input type="number" id="price" name="price" step="0.01" min="0" required>

            <button type="submit">Add Product</button>
        </form>

        <a class="back-link" href="{% url 'product_page' %}">← Back to Products</a>
    </div>
</body>
</html>
