<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Production</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        .back-btn:hover {
            background: #304f70;
        }

        .delete-button {
            background: #dc2626;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Production</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="production_number">Production Number:</label>
            <input
                type="text"
                id="production_number"
                name="production_number"
                value="{{ production.production_number }}"
                required
            >

            <label for="product">Product:</label>
            <select id="product" name="product" required>

                {% for product in products %}
                    <option
                        value="{{ product.id }}"
                        {% if product.id == production.product_id %}selected{% endif %}
                    >
                        {{ product.name }}
                    </option>
                {% endfor %}

            </select>

            <label for="quantity">Quantity:</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                value="{{ production.quantity }}"
                required
            >

            <label for="start_date">Start Date:</label>
            <input
                type="date"
                id="start_date"
                name="start_date"
                value="{{ production.start_date|date:'Y-m-d' }}"
                required
            >

            <label for="end_date">End Date:</label>
            <input
                type="date"
                id="end_date"
                name="end_date"
                value="{{ production.end_date|date:'Y-m-d' }}"
            >

            <label for="status">Status:</label>
            <select id="status" name="status" required>

                <option value="Pending"
                    {% if production.status == 'Pending' %}selected{% endif %}>
                    Pending
                </option>

                <option value="In Progress"
                    {% if production.status == 'In Progress' %}selected{% endif %}>
                    In Progress
                </option>

                <option value="Completed"
                    {% if production.status == 'Completed' %}selected{% endif %}>
                    Completed
                </option>

            </select>

            <button type="submit">Update Production</button>
        </form>

      

        <a href="/api/production/" class="back-btn">
            ← Back to Production List
        </a>

    </div>

</body>
</html>
