<!DOCTYPE html>
<html>

<head>
    <title>Suppliers</title>
</head>

<body>

    <h1>Supplier Management</h1>

    <a href="{% url 'home' %}">← Back to Dashboard</a>

    <br><br>

   <a href="{% url 'add_supplier' %}">+ Add New Supplier</a>
    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Supplier Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
        </tr>

        {% for supplier in suppliers %}

        <tr>
            <td>{{ supplier.id }}</td>
            <td>{{ supplier.name }}</td>
            <td>{{ supplier.contact }}</td>
            <td>{{ supplier.email }}</td>
            <td>{{ supplier.address }}</td>
            <td>
    <a href="{% url 'edit_supplier' supplier.id %}">Edit</a>
    |
    <a href="{% url 'delete_supplier' supplier.id %}"
       onclick="return confirm('Are you sure you want to delete this supplier?');">
        Delete
    </a>
</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
