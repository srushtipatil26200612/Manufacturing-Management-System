<!DOCTYPE html>
<html>

<head>
    <title>Suppliers</title>
    
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        margin: 0;
        padding: 30px;
        color: #1e293b;
    }

    h1 {
        color: #1e3a8a;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
    }

    th, td {
        padding: 12px 15px;
        border: 1px solid #e2e8f0;
        text-align: left;
    }

    th {
        background: #263746;
        color: white;
    }

    tr:nth-child(even) {
        background: #f8fafc;
    }

    input, select {
        padding: 9px;
        margin: 5px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
    }

    button, input[type="submit"] {
        background: #263746;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover, input[type="submit"]:hover {
        background: #40596e;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }
    .button {
    display: inline-block;
    padding: 10px 16px;
    margin: 10px 8px 15px 0;
    background: #263746;
    color: #ffffff;
    text-decoration: none;
    border: none;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
}

.button:hover {
    background: #40596e;
}
</style>
</head>

<body>

    <h1>Supplier Management</h1>
    <br>
    <br>
   <a href="{% url 'add_supplier' %}"  class="button">+ Add New Supplier</a>
    <a href="{% url 'home' %}"  class="button">← Back to Dashboard</a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Supplier Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
        </tr>

        {% for supplier in suppliers %}

        <tr>
            <td>{{ supplier.id }}</td>
            <td>{{ supplier.name }}</td>
            <td>{{ supplier.contact }}</td>
            <td>{{ supplier.email }}</td>
            <td>{{ supplier.address }}</td>
            <td>
    <a href="{% url 'edit_supplier' supplier.id %}">Edit</a>
    |
    <a href="{% url 'delete_supplier' supplier.id %}"
       onclick="return confirm('Are you sure you want to delete this supplier?');">
        Delete
    </a>
</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
