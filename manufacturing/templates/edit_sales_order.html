
<!DOCTYPE html>
<html>
<head>
    <title>Edit Sales Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .form-box {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            background: #263746;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Edit Sales Order</h2>

        <p>Order Number: {{ order.order_number }}</p>
        <p>Customer: {{ order.customer }}</p>

        <form method="post">
            {% csrf_token %}

            <label>Status</label>
            <select name="status">
                <option value="Pending" {% if order.status == "Pending" %}selected{% endif %}>Pending</option>
                <option value="Processing" {% if order.status == "Processing" %}selected{% endif %}>Processing</option>
                <option value="Completed" {% if order.status == "Completed" %}selected{% endif %}>Completed</option>
                <option value="Cancelled" {% if order.status == "Cancelled" %}selected{% endif %}>Cancelled</option>
            </select>

            <label>Total Amount</label>
            <input type="number" name="total_amount"
                   step="0.01" min="0"
                   value="{{ order.total_amount }}" required>

            <button type="submit">Update Sales Order</button>
        </form>

        <p><a href="{% url 'sales_order_page' %}">Back to Sales Orders</a></p>
    </div>
</body>
</html>
