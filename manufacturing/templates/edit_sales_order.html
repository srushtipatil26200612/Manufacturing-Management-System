<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Sales Order</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        .order-info {
            padding: 12px;
            margin-bottom: 15px;
            background: #f3f6f9;
            border-radius: 6px;
        }

        .order-info p {
            margin: 8px 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        .back-btn:hover {
            background: #304f70;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Sales Order</h1>

        <div class="order-info">
            <p>
                <strong>Order Number:</strong>
                {{ order.order_number }}
            </p>

            <p>
                <strong>Customer:</strong>
                {{ order.customer }}
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <label for="status">Status:</label>
            <select id="status" name="status">

                <option value="Pending"
                    {% if order.status == "Pending" %}selected{% endif %}>
                    Pending
                </option>

                <option value="Processing"
                    {% if order.status == "Processing" %}selected{% endif %}>
                    Processing
                </option>

                <option value="Completed"
                    {% if order.status == "Completed" %}selected{% endif %}>
                    Completed
                </option>

                <option value="Cancelled"
                    {% if order.status == "Cancelled" %}selected{% endif %}>
                    Cancelled
                </option>

            </select>

            <label for="total_amount">Total Amount:</label>
            <input
                type="number"
                id="total_amount"
                name="total_amount"
                step="0.01"
                min="0"
                value="{{ order.total_amount }}"
                required
            >

            <button type="submit">Update Sales Order</button>
        </form>

        <a href="{% url 'sales_order_page' %}" class="back-btn">
            ← Back to Sales Orders
        </a>

    </div>

</body>
</html>
