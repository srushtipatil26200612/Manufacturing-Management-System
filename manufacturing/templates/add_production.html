
<!DOCTYPE html>
<html>
<head>
    <title>Add Production</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .form-container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cbd5e1;
        }

        h1 {
            color: #1e3a8a;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

    
button,
.back-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    box-sizing: border-box;
    background: #1e3a5f;
    color: white;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
}

button:hover,
.back-btn:hover {
    background: #304f70;
}

        
    </style>
</head>
<body>
<div class="form-container">
    <h1>Add Production</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Production Number</label>
        <input type="text" name="production_number" required>

        <label>Product</label>
        <select name="product" required>
            <option value="">Select Product</option>
            {% for product in products %}
            <option value="{{ product.id }}">{{ product.name }}</option>
            {% endfor %}
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" min="1" required>

        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <label>End Date</label>
        <input type="date" name="end_date">

        <label>Status</label>
        <select name="status" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Save Production</button>
    </form>

    <a href="/api/production/" class="back-btn">
    ← Back to Production List
</a>
</div>
</body>
</html>
