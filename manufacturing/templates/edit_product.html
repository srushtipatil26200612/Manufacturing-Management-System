<!DOCTYPE html>
<html>

<head>
    <title>Edit Product</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        .form-container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Edit Product</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Product Name:</label>
        <input type="text"
               name="name"
               value="{{ product.name }}"
               required>

        <label>Product Code:</label>
        <input type="text"
               name="product_code"
               value="{{ product.product_code }}"
               required>

        <label>Category:</label>
        <select name="category" required>

            {% for category in categories %}
                <option value="{{ category.id }}"
                    {% if product.category_id == category.id %}selected{% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}

        </select>

        <label>Quantity:</label>
        <input type="number"
               name="quantity"
               value="{{ product.quantity }}"
               min="0"
               required>

        <label>Price:</label>
        <input type="number"
               step="0.01"
               name="price"
               value="{{ product.price }}"
               min="0"
               required>

        <button type="submit">Update Product</button>

    </form>

    <br>

    <a href="{% url 'product_page' %}">← Back to Products</a>

</div>

</body>

</html>
