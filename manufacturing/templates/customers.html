<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>
    
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        margin: 0;
        padding: 30px;
        color: #1e293b;
    }

    h1 {
        color: #1e3a8a;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
    }

    th, td {
        padding: 12px 15px;
        border: 1px solid #e2e8f0;
        text-align: left;
    }

    th {
        background: #263746;
        color: white;
    }

    tr:nth-child(even) {
        background: #f8fafc;
    }

    input, select {
        padding: 9px;
        margin: 5px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
    }

    button, input[type="submit"] {
        background: #263746;
        color: white;
        padding: 10px 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover, input[type="submit"]:hover {
        background: #40596e;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }
</style>
</head>
<body>

    <h1>Customer Management</h1>

    <a href="{% url 'add_customer' %}">Add New Customer</a>

    <table border="1" cellpadding="10">
        <tr>
            <th>Sr. No.</th>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Action</th>
        </tr>

        {% for customer in customers %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ customer.id }}</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.address }}</td>
            <td>
    <a href="{% url 'edit_customer' customer.id %}">Edit</a>
    |
    <a href="{% url 'delete_customer' customer.id %}"
       onclick="return confirm('Are you sure you want to delete this customer?');">
        Delete
    </a>
</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="7">No Customers Found</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
