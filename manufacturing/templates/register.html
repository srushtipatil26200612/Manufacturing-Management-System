<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Manufacturing Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .register-box {
            background: white;
            padding: 35px;
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #0002;
        }

        h2 {
            text-align: center;
            color: #1e3a5f;
            font-size: 23px;
        }

        h3 {
            text-align: center;
            color: #333;
        }

        form p {
            margin-top: 15px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .helptext {
            display: block;
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            line-height: 1.5;
        }

        ul.errorlist {
            color: red;
            font-size: 12px;
            padding-left: 20px;
        }

        .register-btn {
            width: 100%;
            padding: 11px;
            margin-top: 22px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #294d78;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #1e3a5f;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="register-box">

        <h2>Manufacturing Management System</h2>
        <h3>Create Account</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="register-btn">
                Register
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>
</body>
</html>
