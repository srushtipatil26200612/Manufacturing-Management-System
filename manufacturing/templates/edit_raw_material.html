<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Raw Material</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        .back-btn:hover {
            background: #304f70;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Raw Material</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="name">Material Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ material.name }}"
                required
            >

            <label for="material_code">Material Code:</label>
            <input
                type="text"
                id="material_code"
                name="material_code"
                value="{{ material.material_code }}"
                required
            >

            <label for="supplier">Supplier:</label>
            <select id="supplier" name="supplier">

                <option value="">Select Supplier</option>

                {% for supplier in suppliers %}
                    <option
                        value="{{ supplier.id }}"
                        {% if material.supplier_id == supplier.id %}selected{% endif %}
                    >
                        {{ supplier.name }}
                    </option>
                {% endfor %}

            </select>

            <label for="quantity">Quantity:</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ material.quantity }}"
                min="0"
                required
            >

            <label for="unit">Unit:</label>
            <input
                type="text"
                id="unit"
                name="unit"
                value="{{ material.unit }}"
                required
            >

            <label for="price">Price:</label>
            <input
                type="number"
                id="price"
                name="price"
                value="{{ material.price }}"
                step="0.01"
                min="0"
                required
            >

            <button type="submit">Update Raw Material</button>

        </form>

        <a href="{% url 'raw_material_page' %}" class="back-btn">
            ← Back to Raw Materials
        </a>

    </div>

</body>
</html>
