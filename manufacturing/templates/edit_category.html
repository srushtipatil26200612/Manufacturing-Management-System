<!DOCTYPE html>
<html>

<head>
    <title>Edit Category</title>
</head>

<body>

    <h1>Edit Category</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Category Name:</label><br>
        <input type="text"
               name="name"
               value="{{ category.name }}"
               required>

        <br><br>

        <button type="submit">Update Category</button>
    </form>

    <br>

    <a href="{% url 'category_page' %}">← Back to Categories</a>

</body>

</html>
