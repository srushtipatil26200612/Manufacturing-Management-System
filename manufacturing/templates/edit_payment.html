
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #1e3a5f;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .back {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            background: #1e3a5f;
            color: white;
        }

        .back {
            background: #64748b;
            color: white;
        }

        .message {
            padding: 10px;
            background: #fee2e2;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Edit Payment</h1>

    {% for message in messages %}
        <div class="message">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label>Invoice Number</label>
        <input
            type="text"
            value="{{ payment.invoice.invoice_number }}"
            readonly
        >

        <label>Payment Date</label>
        <input
            type="date"
            name="payment_date"
            value="{{ payment.payment_date|date:'Y-m-d' }}"
            required
        >

        <label>Amount</label>
        <input
            type="number"
            name="amount"
            value="{{ payment.amount }}"
            min="0.01"
            step="0.01"
            required
        >

        <label>Payment Method</label>
        <select name="payment_method" required>
            <option value="Cash"
                {% if payment.payment_method == 'Cash' %}selected{% endif %}>
                Cash
            </option>

            <option value="UPI"
                {% if payment.payment_method == 'UPI' %}selected{% endif %}>
                UPI
            </option>

            <option value="Bank Transfer"
                {% if payment.payment_method == 'Bank Transfer' %}selected{% endif %}>
                Bank Transfer
            </option>

            <option value="Cheque"
                {% if payment.payment_method == 'Cheque' %}selected{% endif %}>
                Cheque
            </option>
        </select>

        <label>Reference Number</label>
        <input
            type="text"
            name="reference_number"
            value="{{ payment.reference_number }}"
            maxlength="100"
        >

        <div class="actions">
            <button type="submit">Update Payment</button>
            <a href="{% url 'payment_page' %}" class="back">Back</a>
        </div>
    </form>
</div>
</body>
</html>
