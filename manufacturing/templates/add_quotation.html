<!DOCTYPE html>
<html>
<head>
    <title>Add Quotation</title>
</head>
<body>

    <h1>Add New Quotation</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Enquiry:</label><br>
        <select name="enquiry" required>
            <option value="">Select Enquiry</option>

            {% for enquiry in enquiries %}
                <option value="{{ enquiry.id }}">
                    {{ enquiry.customer.name }} - {{ enquiry.product.name }}
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label>Quotation Number:</label><br>
        <input type="text" name="quotation_number" required>

        <br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" min="1" required>

        <br><br>

        <label>Price:</label><br>
        <input type="number" name="price" step="0.01" min="0" required>

        <br><br>

        <label>Lead Time:</label><br>
        <input type="text" name="lead_time" placeholder="e.g. 10 Days" required>

        <br><br>

        <label>Version:</label><br>
        <input type="number" name="version" value="1" min="1" required>

        <br><br>

        <label>Status:</label><br>
        <select name="status">
            <option value="Draft">Draft</option>
            <option value="Sent">Sent</option>
            <option value="Accepted">Accepted</option>
            <option value="Rejected">Rejected</option>
        </select>

        <br><br>

        <button type="submit">Add Quotation</button>
    </form>

    <br>

    <a href="{% url 'quotation_page' %}">
        ← Back to Quotations
    </a>

</body>
</html>
