<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Enquiry</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            background: white;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        .back-btn:hover {
            background: #304f70;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Enquiry</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="customer">Customer:</label>
            <select id="customer" name="customer" required>

                {% for customer in customers %}
                    <option value="{{ customer.id }}"
                        {% if customer.id == enquiry.customer.id %}selected{% endif %}>
                        {{ customer.name }}
                    </option>
                {% endfor %}

            </select>

            <label for="product">Product:</label>
            <select id="product" name="product" required>

                {% for product in products %}
                    <option value="{{ product.id }}"
                        {% if product.id == enquiry.product.id %}selected{% endif %}>
                        {{ product.name }}
                    </option>
                {% endfor %}

            </select>

            <label for="quantity">Quantity:</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                value="{{ enquiry.quantity }}"
                min="1"
                required
            >

            <label for="requirements">Requirements:</label>
            <textarea
                id="requirements"
                name="requirements"
                rows="4"
            >{{ enquiry.requirements }}</textarea>

            <label for="status">Status:</label>
            <select id="status" name="status">

                <option value="New"
                    {% if enquiry.status == "New" %}selected{% endif %}>
                    New
                </option>

                <option value="In Progress"
                    {% if enquiry.status == "In Progress" %}selected{% endif %}>
                    In Progress
                </option>

                <option value="Quoted"
                    {% if enquiry.status == "Quoted" %}selected{% endif %}>
                    Quoted
                </option>

                <option value="Closed"
                    {% if enquiry.status == "Closed" %}selected{% endif %}>
                    Closed
                </option>

            </select>

            <button type="submit">Update Enquiry</button>

        </form>

        <a href="{% url 'enquiry_page' %}" class="back-btn">
            ← Back to Enquiries
        </a>

    </div>

</body>
</html>
