<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stock Transaction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            background: #f1f5f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 20px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: #263746;
            font-size: 26px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #40596e;
        }

        button,
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 6px;
            background: #263746;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover,
        .button:hover {
            background: #40596e;
        }

        .messages {
            padding: 10px;
            margin-bottom: 15px;
            background: #e0f2fe;
            border-radius: 6px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add Stock Transaction</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="messages">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Raw Material</label>
            <select name="raw_material" required>
                <option value="">Select Raw Material</option>
                {% for material in raw_materials %}
                    <option value="{{ material.id }}">
                        {{ material.name }} (Stock: {{ material.quantity }})
                    </option>
                {% endfor %}
            </select>

            <label>Transaction Type</label>
            <select name="transaction_type" required>
                <option value="IN">Stock In</option>
                <option value="OUT">Stock Out</option>
            </select>

            <label>Quantity</label>
            <input type="number" name="quantity" min="1" required>

            <label>Note</label>
            <textarea name="note"></textarea>

            <button type="submit">Save Transaction</button>
        </form>

        <a href="{% url 'stock_transaction_page' %}" class="button">
            ← Back to Stock Transactions
        </a>

        <a href="{% url 'dashboard' %}" class="button">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
