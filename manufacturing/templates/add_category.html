
<!DOCTYPE html>
<html>
<head>
    <title>Add New Category</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #243447;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 26px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button,
        .button {
            display: inline-block;
            width: 100%;
            margin-top: 20px;
            padding: 12px 16px;
            background: #263746;
            color: white;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover,
        .button:hover {
            background: #40596e;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Add New Category</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="name">Category Name</label>
            <input type="text" id="name" name="name" required>

            <button type="submit">Add Category</button>
        </form>

        <a href="{% url 'category_page' %}" class="button">
            ← Back to Categories
        </a>

        <a href="{% url 'dashboard' %}" class="button">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
