<!DOCTYPE html>
<html>

<head>
    <title>Add Category</title>
</head>

<body>

    <h1>Add New Category</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Category Name:</label><br>
        <input type="text" name="name" required>

        <br><br>

        <button type="submit">Add Category</button>
    </form>

    <br>

    <a href="{% url 'category_page' %}">← Back to Categories</a>

</body>

</html>
