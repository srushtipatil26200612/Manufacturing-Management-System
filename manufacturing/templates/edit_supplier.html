<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Supplier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6f9;
            color: #263746;
        }

        .container {
            max-width: 550px;
            width: 100%;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            color: #1e3a5f;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1e3a5f;
        }

        button,
        .back-btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover,
        .back-btn:hover {
            background: #304f70;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Supplier</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="name">Supplier Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ supplier.name }}"
                required
            >

            <label for="contact">Contact:</label>
            <input
                type="text"
                id="contact"
                name="contact"
                value="{{ supplier.contact }}"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ supplier.email }}"
            >

            <label for="address">Address:</label>
            <textarea
                id="address"
                name="address"
            >{{ supplier.address }}</textarea>

            <button type="submit">Update Supplier</button>

        </form>

        <a href="{% url 'supplier_page' %}" class="back-btn">
            ← Back to Suppliers
        </a>

    </div>

</body>
</html>
