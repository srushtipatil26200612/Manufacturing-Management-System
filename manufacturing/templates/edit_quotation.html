<!DOCTYPE html>
<html>
<head>
    <title>Edit Quotation</title>
</head>
<body>

    <h1>Edit Quotation</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Enquiry:</label><br>
        <select name="enquiry" required>

            {% for enquiry in enquiries %}
                <option value="{{ enquiry.id }}"
                    {% if enquiry.id == quotation.enquiry.id %}selected{% endif %}>
                    {{ enquiry.customer.name }} - {{ enquiry.product.name }}
                </option>
            {% endfor %}

        </select>

        <br><br>

        <label>Quotation Number:</label><br>
        <input type="text"
               name="quotation_number"
               value="{{ quotation.quotation_number }}"
               required>

        <br><br>

        <label>Quantity:</label><br>
        <input type="number"
               name="quantity"
               value="{{ quotation.quantity }}"
               min="1"
               required>

        <br><br>

        <label>Price:</label><br>
        <input type="number"
               name="price"
               value="{{ quotation.price }}"
               step="0.01"
               min="0"
               required>

        <br><br>

        <label>Lead Time:</label><br>
        <input type="text"
               name="lead_time"
               value="{{ quotation.lead_time }}"
               required>

        <br><br>

        <label>Version:</label><br>
        <input type="number"
               name="version"
               value="{{ quotation.version }}"
               min="1"
               required>

        <br><br>

        <label>Status:</label><br>
        <select name="status">

            <option value="Draft"
                {% if quotation.status == "Draft" %}selected{% endif %}>
                Draft
            </option>

            <option value="Sent"
                {% if quotation.status == "Sent" %}selected{% endif %}>
                Sent
            </option>

            <option value="Accepted"
                {% if quotation.status == "Accepted" %}selected{% endif %}>
                Accepted
            </option>

            <option value="Rejected"
                {% if quotation.status == "Rejected" %}selected{% endif %}>
                Rejected
            </option>

        </select>

        <br><br>

        <button type="submit">Update Quotation</button>
    </form>

    <br>

    <a href="{% url 'quotation_page' %}">
        ← Back to Quotations
    </a>

</body>
</html>
